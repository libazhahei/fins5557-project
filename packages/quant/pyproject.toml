[project]
name = "quant-lab-quant"
version = "0.1.0"
description = "Modular quant steps M1–M9 for Quant Lab"
requires-python = ">=3.12"
dependencies = [
  "numpy>=1.26",
  "pandas>=2.2",
  "pyarrow>=24.0",
  "yfinance>=0.2.40",
  "pydantic>=2.10",
  "pydantic-settings>=2.7",
]

[project.optional-dependencies]
optimize = [
  "riskfolio-lib>=6.0",
]
dev = [
  "pytest>=8.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel.force-include]
"src/quant_lab" = "quant_lab"

[project.scripts]
quant-lab = "quant_lab.cli:main"
