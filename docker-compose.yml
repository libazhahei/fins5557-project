services:
  postgres:
    image: postgres:16-alpine
    container_name: quantlab-postgres
    environment:
      POSTGRES_USER: quant
      POSTGRES_PASSWORD: quant
      POSTGRES_DB: quantlab
    ports:
      - "5432:5432"
    volumes:
      - quantlab_pg:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U quant -d quantlab"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  quantlab_pg:
