[project]
name = "quant-lab"
version = "0.1.0"
description = "Agent-first quant research lab (Quant Lab)"
requires-python = ">=3.12"
dependencies = []

[tool.uv.workspace]
members = [
  "packages/quant",
  "apps/api",
  "apps/worker",
]

[tool.uv]
package = false

[dependency-groups]
dev = [
  "pytest>=8.0",
  "ruff>=0.9",
]

[tool.pytest.ini_options]
testpaths = ["packages/quant/tests", "apps/api/tests"]
pythonpath = ["packages/quant/src", "apps/api/src"]

[tool.ruff]
line-length = 100
target-version = "py312"
